name: Publish calculator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp release
        run: |
          printf '%s\n' "$GITHUB_SHA" > release.txt
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('</head>', '<meta name="release" content="' + os.environ['GITHUB_SHA'] + '"></head>')
          path.write_text(html, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/actions/runs/' + os.environ['RUN_ID'] + '/artifacts'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = [a for a in json.load(response)['artifacts'] if a['name'] == 'github-pages' and not a['expired']]
              if len(artifacts) == 1:
                  print('Pages artifact is visible:', artifacts[0]['id'])
                  break
              if len(artifacts) > 1:
                  raise SystemExit('Multiple Pages artifacts: start a fresh workflow run instead of rerunning upload')
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact metadata did not become visible')
          PY
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public release
        env:
          SITE_URL: https://avtomatizaciya.github.io/kalkulyator-zhkh/
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base, expected = os.environ['SITE_URL'], os.environ['GITHUB_SHA']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + 'release.txt?v=' + expected, timeout=15) as response:
                      actual = response.read().decode().strip()
                  with urllib.request.urlopen(base + '?v=' + expected, timeout=15) as response:
                      html = response.read().decode()
                  if actual == expected and expected in html:
                      print('Verified public release:', expected)
                      break
              except OSError:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Public site does not serve the expected release')
          PY
